    <style>
        body { font-family: 'Roboto', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            max-height: 0;
            overflow: hidden;
        }
        .accordion-btn[aria-expanded="true"] .accordion-icon { transform: rotate(180deg); }
        
        /* Modal Transition */
        .modal {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal.open {
            opacity: 1;
            visibility: visible;
        }
        .modal.open .modal-content {
            transform: scale(1);
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Amount Button Active State */
        .amount-btn.active {
            background-color: #0a68ac; /* Primary */
            color: white;
            border-color: #0a68ac;
        }
        /* Dark Mode Active State Override */
        html.dark .amount-btn.active {
            background-color: #67e8f9; /* cyan-300 */
            color: #18191a; /* darker bg */
            border-color: #67e8f9;
        }
    </style>

                    <button onclick="updateAmount(500000, this)" class="amount-btn py-2 px-1 rounded-lg border border-border dark:border-borderDark bg-bgLight dark:bg-bgDark text-dark dark:text-white font-medium text-sm hover:border-primary dark:hover:border-cyan-300 dark:hover:text-cyan-300 transition-colors">500k</button>

    <script>
        lucide.createIcons();

        // --- Theme Toggle Logic ---
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                icon.setAttribute('data-lucide', 'moon'); // Icon trăng
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                icon.setAttribute('data-lucide', 'sun'); // Icon mặt trời
            }
            lucide.createIcons(); // Re-render icon
        }

        // Init Theme on Load
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', 'moon');
        }
        lucide.createIcons();

        // --- Modal & QR Logic (Existing) ---
        function openDonateModal() { document.getElementById('donate-modal').classList.add('open'); }
        function closeDonateModal() { document.getElementById('donate-modal').classList.remove('open'); }
        document.getElementById('donate-modal').addEventListener('click', function(e) { if (e.target === this) closeDonateModal(); });

        const BANK_ID = 'MB'; const ACCOUNT_NO = '9397426841'; const TEMPLATE = 'compact2'; const CONTENT = 'Coffee Donate';
        function updateAmount(amount, btnElement) {
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            const loading = document.getElementById('qr-loading');
            const img = document.getElementById('modal-qr-img');
            loading.classList.remove('hidden');
            img.src = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-${TEMPLATE}.png?amount=${amount}&addInfo=${encodeURIComponent(CONTENT)}`;
        }

        function toggleAccordion(button) {
            const content = button.nextElementSibling;
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            document.querySelectorAll('.accordion-btn').forEach(btn => { if (btn !== button) { btn.setAttribute('aria-expanded', 'false'); btn.nextElementSibling.style.maxHeight = null; }});
            button.setAttribute('aria-expanded', !isExpanded);
            content.style.maxHeight = !isExpanded ? content.scrollHeight + "px" : null;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'translate-y-2');
                toast.classList.add('translate-y-0');
                setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); toast.classList.remove('translate-y-0'); }, 2000);
            });
        }
        
        function downloadQR() {
            const img = document.getElementById('modal-qr-img');
            const link = document.createElement('a');
            link.href = img.src;
            link.download = `vietqr-donate-${Date.now()}.png`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
